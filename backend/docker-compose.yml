version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:6.0
    container_name: smartcard_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - smartcard_network

  # Redis service
  redis:
    image: redis:7.0-alpine
    container_name: smartcard_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartcard_network

  # Backend App service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcard_api
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/smartcard-saas
      - REDIS_URI=redis://redis:6379
      - JWT_ACCESS_SECRET=your_super_secret_access_token_secret_key_123!
      - JWT_REFRESH_SECRET=your_super_secret_refresh_token_secret_key_456!
      - CLOUDINARY_CLOUD_NAME=your_cloud_name
      - CLOUDINARY_API_KEY=your_api_key
      - CLOUDINARY_API_SECRET=your_api_secret
    networks:
      - smartcard_network

volumes:
  mongodb_data:
  redis_data:

networks:
  smartcard_network:
    driver: bridge
